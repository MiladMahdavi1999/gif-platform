name: B00 through B09 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  b00:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-test-gates.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg gcc
      - run: pnpm test
      - run: pnpm api:check
      - run: pnpm build
      - run: cp .env.example .env
      - name: Initialize strictly disposable fresh fixtures
        run: |
          docker compose --env-file .env -f infra/compose.yaml down --volumes --remove-orphans
          docker compose -f infra/compose.db-test.yaml down --volumes --remove-orphans
      - run: pnpm dev
      - name: Retain pinned MinIO runtime for reproducible local verification
        run: docker save gif-platform-minio:2025-10-15 | gzip > work-minio-runtime.tar.gz
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: b03-minio-runtime
          path: work-minio-runtime.tar.gz
          retention-days: 1
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - run: pnpm db:reset --confirm=gif_platform
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - run: pnpm test:smoke
      - run: docker compose -f infra/compose.db-test.yaml up -d --wait
      - name: All B01 through B08 real PostgreSQL MinIO FFmpeg recovery and security integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://gif_platform:local_only_integration_password@127.0.0.1:55432/gif_platform_test
          ALLOW_DATABASE_INTEGRATION_TESTS: 'true'
          ALLOW_STORAGE_INTEGRATION_TESTS: 'true'
          TEST_S3_ACCESS_KEY_ID: local_access_key
          TEST_S3_SECRET_ACCESS_KEY: local_only_storage_password
          TEST_S3_INTERNAL_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_PUBLIC_ENDPOINT: http://localhost:9000
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Isolate runtime log checks from browser login retry budgets
        run: |
          docker compose --env-file .env -f infra/compose.yaml restart api
          docker compose --env-file .env -f infra/compose.yaml up -d --no-deps --no-build --wait api
          pnpm test:smoke
      - run: node scripts/test-auth-log-hygiene.mjs
      - run: node scripts/test-upload-log-hygiene.mjs
      - run: node scripts/test-review-log-hygiene.mjs
      - run: node scripts/test-public-log-hygiene.mjs
      - run: node scripts/test-operations.mjs
      - run: node scripts/test-dependency-failures.mjs
      - run: node scripts/test-local-lifecycle.mjs --confirm=gif_platform
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: b08-browser-runtime-evidence
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        run: |
          docker compose --env-file .env -f infra/compose.yaml down --volumes --remove-orphans
          docker compose -f infra/compose.db-test.yaml down --volumes --remove-orphans

  b01-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: gif_platform
          POSTGRES_PASSWORD: local_ci_database_password
          POSTGRES_DB: gif_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gif_platform -d gif_platform_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://gif_platform:local_ci_database_password@127.0.0.1:5432/gif_platform_test
      ALLOW_DATABASE_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - name: Verify schema generation has no drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git ls-files --others --exclude-standard packages/db/migrations)"
      - name: B01 and B02 PostgreSQL regression tests (B03 also runs in full-stack job)
        run: pnpm test:integration --exclude packages/db/src/uploads.integration.test.ts --exclude packages/db/src/processing.integration.test.ts --exclude packages/db/src/review.integration.test.ts --exclude packages/db/src/public.integration.test.ts

  b09-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-test-gates.mjs
      - run: pnpm build:packages
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build traceable production images without publishing
        run: |
          pnpm staging init
          pnpm staging validate
          pnpm staging build
      - name: Fresh infrastructure, explicit idempotent migration and empty platform
        run: |
          pnpm staging infra
          pnpm staging migrate
          pnpm staging migrate
          pnpm staging empty
      - name: Separate provisioning and explicitly authorized test bootstrap
        run: |
          pnpm staging provision
          if pnpm staging bootstrap; then
            echo 'FAIL: bootstrap accepted without authorization'
            exit 1
          fi
          pnpm staging bootstrap --authorize-test-identities
          pnpm staging bootstrap --authorize-test-identities
          pnpm staging start
          pnpm staging verify
      - name: Real staging Chromium journey (no mocked routes)
        run: |
          pnpm staging smoke
          pnpm staging logs-check
      - name: Quiescent database and version-preserving storage restore in disposable project
        run: |
          pnpm staging backup
          pnpm staging restore-drill
      - name: Safe service diagnostics on failure
        if: failure()
        run: pnpm staging logs-check
      - name: Verify required staging evidence exists
        run: |
          test -s work/b09-image-provenance.json
          test -s work/b09-smoke-evidence.json
          test -s work/b09-restore-evidence.json
          test -s work/b09-staging-playwright.json
          test -s work/b09-log-hygiene.json
      - if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: b09-staging-safe-evidence
          path: |
            work/b09-image-provenance.json
            work/b09-smoke-evidence.json
            work/b09-restore-evidence.json
            work/b09-staging-playwright.json
            work/b09-picker-selected.png
            work/b09-log-hygiene.json
            work/b09-service-safe.log
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: pnpm staging down
