name: B00 and B01 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  b00:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cp .env.example .env
      - run: pnpm dev
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - run: pnpm db:reset --confirm=gif_platform
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/test-dependency-failures.mjs
      - run: node scripts/test-local-lifecycle.mjs --confirm=gif_platform
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: b00-browser-evidence
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down

  b01-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: gif_platform
          POSTGRES_PASSWORD: local_ci_database_password
          POSTGRES_DB: gif_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gif_platform -d gif_platform_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://gif_platform:local_ci_database_password@127.0.0.1:5432/gif_platform_test
      ALLOW_DATABASE_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - name: Verify schema generation has no drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git ls-files --others --exclude-standard packages/db/migrations)"
      - run: pnpm test:integration
