name: gif-platform-b00

x-local-network: &local-network
  NO_PROXY: localhost,127.0.0.1,::1,api,web,db,minio,edge
  no_proxy: localhost,127.0.0.1,::1,api,web,db,minio,edge

x-app: &app
  image: gif-platform-b00:local
  build:
    context: ..
    dockerfile: infra/docker/Dockerfile
  init: true
  stop_grace_period: 10s

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 2s
      retries: 20
    stop_grace_period: 10s

  minio:
    image: gif-platform-minio:2025-10-15
    build:
      context: ..
      dockerfile: infra/minio/Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set local storage access key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set local storage secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_BASE_URL:?Set exact browser origin}
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, /usr/local/bin/health]
      interval: 3s
      timeout: 2s
      retries: 20
    stop_grace_period: 10s

  storage-init:
    <<: *app
    command: [node, scripts/provision-storage.mjs]
    environment:
      <<: *local-network
      NODE_ENV: development
      APP_ENV: development
      ALLOW_DEV_DATABASE_COMMANDS: 'true'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-gif-quarantine}
      S3_DERIVATIVES_BUCKET: ${S3_DERIVATIVES_BUCKET:-gif-processed}
    depends_on:
      minio: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *local-network
      NODE_ENV: development
      PORT: '4000'
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gif_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      CSRF_ORIGIN: ${PUBLIC_BASE_URL:?Set public base URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set public base URL}
      DATABASE_URL: ${DATABASE_URL:?Set database URL}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:?Set internal storage URL}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set browser storage URL}
      S3_REGION: ${S3_REGION:?Set storage region}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set local storage access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set local storage secret}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-gif-quarantine}
      S3_DERIVATIVES_BUCKET: ${S3_DERIVATIVES_BUCKET:-gif-processed}
      MEDIA_UPLOAD_POLICY_TTL_SECONDS: ${MEDIA_UPLOAD_POLICY_TTL_SECONDS:-600}
      MAX_GIF_UPLOAD_BYTES: ${MAX_GIF_UPLOAD_BYTES:-20971520}
      MAX_GIF_OUTPUT_BYTES: ${MAX_GIF_OUTPUT_BYTES:-20971520}
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 4s
      retries: 20

  web:
    <<: *app
    environment: *local-network
    command:
      [
        node,
        apps/web/node_modules/next/dist/bin/next,
        start,
        apps/web,
        --hostname,
        '0.0.0.0',
        --port,
        '3000',
      ]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  storage-worker-init:
    image: gif-platform-minio:2025-10-15
    entrypoint: [/usr/local/bin/provision-worker]
    environment:
      <<: *local-network
      APP_ENV: development
      ALLOW_DEV_DATABASE_COMMANDS: 'true'
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-gif-quarantine}
      S3_DERIVATIVES_BUCKET: ${S3_DERIVATIVES_BUCKET:-gif-processed}
      S3_WORKER_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:?Set separate worker storage key}
      S3_WORKER_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?Set separate worker storage secret}
    depends_on:
      storage-init: { condition: service_completed_successfully }

  worker:
    <<: *app
    image: gif-platform-worker:b04
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: worker
    command: [node, apps/worker/dist/main.js]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=100m,mode=1777
    environment:
      <<: *local-network
      NODE_ENV: development
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DATABASE_URL: ${WORKER_DATABASE_URL:?Set restricted worker database URL}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-gif-quarantine}
      S3_DERIVATIVES_BUCKET: ${S3_DERIVATIVES_BUCKET:-gif-processed}
      MAX_GIF_UPLOAD_BYTES: ${MAX_GIF_UPLOAD_BYTES:-20971520}
      MEDIA_JOB_MAX_ATTEMPTS: ${MEDIA_JOB_MAX_ATTEMPTS:-3}
      MEDIA_JOB_LEASE_SECONDS: ${MEDIA_JOB_LEASE_SECONDS:-30}
      MEDIA_JOB_POLL_INTERVAL_MS: ${MEDIA_JOB_POLL_INTERVAL_MS:-1000}
      MAX_GIF_PIXELS: ${MAX_GIF_PIXELS:-16000000}
      MAX_GIF_DIMENSION: ${MAX_GIF_DIMENSION:-4096}
      MAX_GIF_DURATION_SECONDS: ${MAX_GIF_DURATION_SECONDS:-30}
      MAX_GIF_FRAMES: ${MAX_GIF_FRAMES:-300}
      MAX_GIF_OUTPUT_BYTES: ${MAX_GIF_OUTPUT_BYTES:-20971520}
      MEDIA_EXECUTION_TIMEOUT_MS: ${MEDIA_EXECUTION_TIMEOUT_MS:-10000}
      MEDIA_JOB_TIMEOUT_MS: ${MEDIA_JOB_TIMEOUT_MS:-60000}
    depends_on:
      db: { condition: service_healthy }
      storage-worker-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/gif-worker-heartbeat','utf8'))<15000?0:1)",
        ]
      interval: 5s
      timeout: 2s
      retries: 3

  edge:
    image: caddy:2.10.2-alpine
    environment: *local-network
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          wget,
          -q,
          -Y,
          'off',
          -O,
          /dev/null,
          http://127.0.0.1:8080/api/v1/health/live,
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 10s

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
