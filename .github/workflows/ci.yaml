name: B00 through B03 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  b00:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm api:check
      - run: pnpm build
      - run: cp .env.example .env
      - run: pnpm dev
      - name: Retain pinned MinIO runtime for reproducible local verification
        run: docker save gif-platform-minio:2025-10-15 | gzip > work-minio-runtime.tar.gz
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: b03-minio-runtime
          path: work-minio-runtime.tar.gz
          retention-days: 1
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - run: pnpm db:reset --confirm=gif_platform
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - run: pnpm test:smoke
      - run: docker compose -f infra/compose.db-test.yaml up -d --wait
      - name: All B01 B02 B03 real PostgreSQL and MinIO integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://gif_platform:local_only_integration_password@127.0.0.1:55432/gif_platform_test
          ALLOW_DATABASE_INTEGRATION_TESTS: 'true'
          ALLOW_STORAGE_INTEGRATION_TESTS: 'true'
          TEST_S3_ACCESS_KEY_ID: local_access_key
          TEST_S3_SECRET_ACCESS_KEY: local_only_storage_password
          TEST_S3_INTERNAL_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_PUBLIC_ENDPOINT: http://localhost:9000
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/test-auth-log-hygiene.mjs
      - run: node scripts/test-upload-log-hygiene.mjs
      - run: node scripts/test-dependency-failures.mjs
      - run: node scripts/test-local-lifecycle.mjs --confirm=gif_platform
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm db:inspect:dev
      - if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: b03-browser-evidence
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down

  b01-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: gif_platform
          POSTGRES_PASSWORD: local_ci_database_password
          POSTGRES_DB: gif_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gif_platform -d gif_platform_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://gif_platform:local_ci_database_password@127.0.0.1:5432/gif_platform_test
      ALLOW_DATABASE_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - name: Verify schema generation has no drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git ls-files --others --exclude-standard packages/db/migrations)"
      - name: B01 and B02 PostgreSQL regression tests (B03 also runs in full-stack job)
        run: pnpm test:integration --exclude packages/db/src/uploads.integration.test.ts
