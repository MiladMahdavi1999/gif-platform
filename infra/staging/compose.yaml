# Local staging ONLY. No source mounts, seed, build-on-start, or external registry.
x-local-network: &local-network
  HTTP_PROXY: ''
  HTTPS_PROXY: ''
  ALL_PROXY: ''
  NO_PROXY: '*'
  http_proxy: ''
  https_proxy: ''
  all_proxy: ''
  no_proxy: '*'
x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: 'no'
  stop_grace_period: 10s
  networks: [private]
  environment: *local-network
x-env: &env
  <<: *local-network
  NODE_ENV: production
  APP_ENV: staging
  PUBLIC_BASE_URL: https://localhost:8443
  CSRF_ORIGIN: https://localhost:8443
  NODE_EXTRA_CA_CERTS: /certs/ca.crt
  S3_INTERNAL_ENDPOINT: https://minio:9000
  S3_PUBLIC_ENDPOINT: https://localhost:9443
  S3_REGION: us-east-1
  S3_QUARANTINE_BUCKET: gif-staging-quarantine
  S3_DERIVATIVES_BUCKET: gif-staging-processed
  PUBLIC_CURSOR_SECRET: ${PUBLIC_CURSOR_SECRET:?required}
  PUBLIC_MEDIA_CACHE_SECONDS: '0'
  PUBLIC_READ_LIMIT_PER_MINUTE: '300'
  PUBLIC_MEDIA_LIMIT_PER_MINUTE: '600'
  PUBLIC_MEDIA_MAX_CONCURRENT: '5'
x-app: &app
  <<: *hardening
  image: ${APP_IMAGE:?build explicit images first}
  pull_policy: never
  user: node
  tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=100m,mode=1777']
  volumes:
    - ${STAGING_CERTS_DIR:?required}/ca.crt:/certs/ca.crt:ro
  environment: &api-env
    <<: *env
    DATABASE_URL: ${API_DATABASE_URL:?required}
    S3_ACCESS_KEY_ID: ${S3_API_ACCESS_KEY_ID:?required}
    S3_SECRET_ACCESS_KEY: ${S3_API_SECRET_ACCESS_KEY:?required}
services:
  db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    networks: [private]
    restart: 'no'
    command:
      [
        postgres,
        -c,
        log_error_verbosity=terse,
        -c,
        log_min_error_statement=panic,
        -c,
        log_parameter_max_length_on_error=0,
        -c,
        log_statement=none,
      ]
    environment:
      <<: *local-network
      POSTGRES_USER: gif_staging_admin
      POSTGRES_DB: gif_platform_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U gif_staging_admin -d gif_platform_staging']
      interval: 3s
      timeout: 2s
      retries: 30
  minio:
    <<: *hardening
    # Browser POST needs the loopback published port; backend consumers stay private.
    networks: [private, ingress]
    image: ${MINIO_IMAGE:?required}
    pull_policy: never
    command: [server, /data, --certs-dir, /certs, --console-address, ':9001']
    environment:
      <<: *local-network
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_API_CORS_ALLOW_ORIGIN: https://localhost:8443
      MINIO_HEALTH_URL: https://localhost:9000/minio/health/ready
      SSL_CERT_FILE: /certs/ca.crt
    ports: ['127.0.0.1:9443:9000']
    volumes:
      - minio_data:/data
      - ${STAGING_CERTS_DIR}/public.crt:/certs/public.crt:ro
      - ${STAGING_CERTS_DIR}/private.key:/certs/private.key:ro
      - ${STAGING_CERTS_DIR}/ca.crt:/certs/ca.crt:ro
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777']
    healthcheck:
      test: [CMD, /usr/local/bin/health]
      interval: 3s
      timeout: 2s
      retries: 30
  admin:
    <<: *app
    profiles: [tools]
    command: [node, scripts/staging-admin.mjs, verify]
    environment:
      <<: *env
      DATABASE_URL: ${ADMIN_DATABASE_URL:?required}
      API_DATABASE_URL: ${API_DATABASE_URL}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?required}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      BOOTSTRAP_UPLOADER_EMAIL: ${BOOTSTRAP_UPLOADER_EMAIL:?required}
      BOOTSTRAP_UPLOADER_PASSWORD: ${BOOTSTRAP_UPLOADER_PASSWORD:?required}
      BOOTSTRAP_REVIEWER_EMAIL: ${BOOTSTRAP_REVIEWER_EMAIL:?required}
      BOOTSTRAP_REVIEWER_PASSWORD: ${BOOTSTRAP_REVIEWER_PASSWORD:?required}
      ALLOW_STAGING_BOOTSTRAP: ${ALLOW_STAGING_BOOTSTRAP:-false}
      ALLOW_STAGING_PROVISION: ${ALLOW_STAGING_PROVISION:-false}
  storage-iam:
    <<: *hardening
    profiles: [tools]
    image: ${MINIO_IMAGE}
    pull_policy: never
    entrypoint: [/usr/local/bin/provision-worker]
    environment:
      <<: *local-network
      APP_ENV: staging
      ALLOW_STAGING_PROVISION: ${ALLOW_STAGING_PROVISION:-false}
      S3_INTERNAL_ENDPOINT: https://minio:9000
      SSL_CERT_FILE: /certs/ca.crt
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_API_ACCESS_KEY_ID: ${S3_API_ACCESS_KEY_ID}
      S3_API_SECRET_ACCESS_KEY: ${S3_API_SECRET_ACCESS_KEY}
      S3_WORKER_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:?required}
      S3_WORKER_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?required}
      S3_QUARANTINE_BUCKET: gif-staging-quarantine
      S3_DERIVATIVES_BUCKET: gif-staging-processed
    volumes: ['${STAGING_CERTS_DIR}/ca.crt:/certs/ca.crt:ro']
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777']
  api:
    <<: *app
    command: [node, apps/api/dist/main.js]
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 30
  web:
    <<: *app
    environment:
      <<: *local-network
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      API_INTERNAL_URL: http://api:4000
      PUBLIC_BASE_URL: https://localhost:8443
    volumes: []
    command:
      [
        node,
        apps/web/node_modules/next/dist/bin/next,
        start,
        apps/web,
        --hostname,
        '0.0.0.0',
        --port,
        '3000',
      ]
    mem_limit: 768m
    pids_limit: 100
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    <<: *app
    image: ${WORKER_IMAGE:?required}
    command: [node, apps/worker/dist/main.js]
    environment:
      <<: *env
      DATABASE_URL: ${WORKER_DATABASE_URL}
      S3_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY}
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const f=require('node:fs');process.exit(Date.now()-Number(f.readFileSync('/tmp/gif-worker-heartbeat','utf8'))<15000?0:1)",
        ]
      interval: 5s
      timeout: 2s
      retries: 10
  edge:
    <<: *hardening
    image: ${EDGE_IMAGE:?required}
    pull_policy: never
    user: '1000:1000'
    networks: [private, ingress]
    ports: ['127.0.0.1:8443:8443']
    tmpfs:
      - '/config:rw,noexec,nosuid,nodev,size=8m,mode=1777'
      - '/data:rw,noexec,nosuid,nodev,size=8m,mode=1777'
    volumes:
      - ${STAGING_CERTS_DIR}/public.crt:/certs/public.crt:ro
      - ${STAGING_CERTS_DIR}/private.key:/certs/private.key:ro
volumes:
  postgres_data:
  minio_data:
networks:
  private:
    internal: true
  ingress: {}
