name: Decoder sandbox
on:
  push:
    branches: ['fix/issue-12-decoder-sandbox']
  pull_request:
    paths:
      - 'apps/worker/**'
      - 'infra/decoder/**'
      - 'packages/testing/**'
      - '.github/workflows/decoder.yaml'
permissions:
  contents: read
jobs:
  decoder:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container:
      image: node:24.19.0-trixie-slim@sha256:ab3eebe934147fee049b5eb83c570f68c849a13c930bdfa482de99fcdfa3b3de
    steps:
      - uses: actions/checkout@v4.3.0
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg=7:7.1.5-0+deb13u1 gcc libc6-dev
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm test apps/worker/src/decoder
